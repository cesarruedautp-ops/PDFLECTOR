<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://js.hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.hcaptcha.com; frame-src https://*.hcaptcha.com https://newassets.hcaptcha.com; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.hcaptcha.com https://bnilhzijsxulgczvnyxn.supabase.co wss://bnilhzijsxulgczvnyxn.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>SGD - Recuperar contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=23">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body>
  <div class="login-container">
    <form id="forgotForm">
      <h1>Recuperar contraseña</h1>
      <p class="sub">Ingrese su correo institucional. Si tiene una cuenta activa, le enviaremos un enlace para restablecer su contraseña.</p>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="nombre.apellidoUTP@gmail.com" required>
      </div>
      <div class="h-captcha" data-sitekey="904881b0-b654-48c2-8e52-42823d420c50" style="margin-bottom:1rem;"></div>
      <button type="submit" id="submitBtn" class="btn btn-primary">Enviar enlace de recuperación</button>
      <div class="error" id="errorMsg"></div>
      <p id="successMsg" class="success hidden"></p>
      <p class="forgot-link"><a href="login.html">Volver a iniciar sesión</a></p>
    </form>
  </div>

  <script src="js/supabase-client.js?v=23"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      document.getElementById("errorMsg").textContent = "";

      const captchaToken = typeof hcaptcha !== "undefined" ? hcaptcha.getResponse() : "";
      if (!captchaToken) {
        document.getElementById("errorMsg").textContent = "Complete la verificación (no soy un robot) antes de continuar.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando...";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/reset-password.html`,
        captchaToken,
      });

      if (typeof hcaptcha !== "undefined") hcaptcha.reset();

      submitBtn.disabled = false;
      submitBtn.textContent = "Enviar enlace de recuperación";

      document.getElementById("successMsg").textContent =
        "Si el correo esta registrado, recibira un enlace de recuperación en unos minutos. Revise tambien su carpeta de spam.";
      document.getElementById("successMsg").classList.remove("hidden");
      form.reset();

      if (error) console.warn("Auth error (no mostrado al usuario):", error.message);
    });
  </script>
</body>
</html>
