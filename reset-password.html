<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://bnilhzijsxulgczvnyxn.supabase.co wss://bnilhzijsxulgczvnyxn.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>SGD - Nueva contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=23">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-container">
    <div style="background:var(--paper);width:380px;max-width:100%;border-radius:2px;border-top:4px solid var(--bronze);padding:2.5rem 2.25rem;">
      <h1>Establecer nueva contraseña</h1>
      <p class="sub" id="checkingMsg">Verificando enlace de recuperación...</p>

      <form id="resetForm" class="hidden">
        <div class="field"><label>Nueva contraseña (min. 8 caracteres)</label><input type="password" id="newPassword" required minlength="8"></div>
        <div class="field"><label>Confirmar contraseña</label><input type="password" id="confirmPassword" required minlength="8"></div>
        <div class="error" id="errorMsg"></div>
        <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
      </form>

      <div id="invalidLinkMsg" class="hidden">
        <p class="error">Este enlace de recuperación no es valido o ya expiro.</p>
        <p class="forgot-link"><a href="forgot-password.html">Solicitar uno nuevo</a></p>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js?v=23"></script>
  <script>
    let recoverySessionReady = false;

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoverySessionReady = true;
        document.getElementById("checkingMsg").classList.add("hidden");
        document.getElementById("resetForm").classList.remove("hidden");
      }
    });

    setTimeout(() => {
      if (!recoverySessionReady) {
        document.getElementById("checkingMsg").classList.add("hidden");
        document.getElementById("invalidLinkMsg").classList.remove("hidden");
      }
    }, 4000);

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorEl = document.getElementById("errorMsg");
      errorEl.textContent = "";

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Las contraseñas no coinciden.";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword,
        data: { must_change_password: false },
      });

      if (error) {
        errorEl.textContent = "No se pudo actualizar. Intente con una contraseña mas segura.";
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      await supabaseClient.from("audit_logs").insert({
        user_id: session.user.id,
        action: "PASSWORD_RESET_COMPLETE",
        detail: "Usuario resto su contraseña via enlace de recuperación",
      });

      await supabaseClient.auth.signOut();
      window.location.href = "login.html?reset=success";
    });
  </script>
</body>
</html>
