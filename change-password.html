<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://bnilhzijsxulgczvnyxn.supabase.co wss://bnilhzijsxulgczvnyxn.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>SGD - Cambiar contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=23">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-container">
    <form id="changePasswordForm">
      <h1>Debe establecer una contraseña personal</h1>
      <p class="sub">Por seguridad, no puede continuar usando la contraseña temporal.</p>
      <div class="field">
        <label>Nueva contraseña (min. 8 caracteres)</label>
        <input type="password" id="newPassword" required minlength="8">
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required minlength="8">
      </div>
      <div class="error" id="errorMsg"></div>
      <button type="submit" class="btn btn-primary">Guardar contraseña</button>
    </form>
  </div>

  <script src="js/supabase-client.js?v=23"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) window.location.href = "login.html";
    })();

    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorEl = document.getElementById("errorMsg");
      errorEl.textContent = "";

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Las contraseñas no coinciden";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword,
        data: { must_change_password: false },
      });

      if (error) {
        errorEl.textContent = "No se pudo actualizar la contraseña. Intente con una mas segura.";
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
